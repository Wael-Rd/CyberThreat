name: Validate source and MCP
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mcp_server/requirements.txt "pypdf[image]==5.4.0"
      - run: python -m compileall -q station target scripts mcp_server tests
      - run: python tests/test_triage.py
      - run: python tests/test_mcp.py
      - run: python tests/test_evidence_summary.py
      - run: python tests/test_report.py
      - run: python scripts/validate_delivery.py
