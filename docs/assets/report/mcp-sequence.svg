 autorisé</text><path d="M500 350L855 350" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="677.5" y="340.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#466c99">Commande fixe / contrôle du guard</text><path d="M855 425L1210 425" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1032.5" y="415.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#466c99">Capture ou triage statique</text><path d="M1210 510L500 510" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="855.0" y="500.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#466c99">Résultats / artefacts bornés</text><path d="M500 585L145 585" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="322.5" y="575.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#466c99">Réponse avec données non fiables</text><text x="45" y="710" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#20354e">Transport SDK et connexion native testés; aucun appel à un modèle hébergé dans la validation.</text></svg>