<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#466c99"/></marker></defs><rect width="1400" height="710" fill="white"/><text x="40" y="48" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#20354e">Isolation et permissions par acteur</text><text x="40" y="80" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#64758a">Synthèse des contrôles observés; aucun fichier suspect n’est exécuté.</text><rect x="45" y="150" width="1310" height="135" rx="10" fill="#eef3f8" stroke="#b9c9da"/><text x="65" y="185" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#20354e">Hôte : frontière de confiance</text><text x="65" y="218" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">Administrateur / noyau WSL2 / Docker / serveur MCP</text><rect x="90" y="320" width="610" height="225" rx="10" fill="#eef3f8" stroke="#b9c9da"/><text x="110" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#20354e">Services Docker</text><text x="110" y="388" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">Racine en lecture seule / seccomp</text><text x="110" y="414" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">Pas de socket Docker / pas de périphériques hôte</text><text x="110" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">Cible : capacités nulles</text><text x="110" y="466" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">Capture station : NET_RAW uniquement</text><rect x="740" y="320" width="570" height="225" rx="10" fill="#eef3f8" stroke="#b9c9da"/><text x="760" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#20354e">Worker statique</text><text x=