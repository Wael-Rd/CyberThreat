<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#466c99"/></marker></defs><rect width="1400" height="760" fill="white"/><text x="40" y="48" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#20354e">Architecture et frontière réseau</text><text x="40" y="80" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#64758a">Schéma explicatif de la configuration réellement testée.</text><rect x="365" y="235" width="975" height="375" rx="14" fill="#f8fafc" stroke="#b9c9da" stroke-dasharray="7 5"/><text x="395" y="274" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#20354e">Réseau Docker interne / aucune publication de port</text><rect x="45" y="300" width="265" height="125" rx="10" fill="#eef3f8" stroke="#b9c9da"/><text x="65" y="335" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#20354e">Hôte de confiance</text><text x="65" y="368" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">WSL2 + Docker Engine</text><text x="65" y="394" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">MCP local / OpenCode</text><rect x="410" y="335" width="335" height="135" rx="10" fill="#eef3f8" stroke="#b9c9da"/><text x="430" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#20354e">Station d’analyse</text><text x="430" y="403" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">Nmap / dumpcap / TShark</text><text x="430" y="429" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">NET_RAW pour la capture</text><rect x="930" y="335" width="335" height="135" rx="10" fill="#eef3f8" stroke="#b9c9da"/><text x="950" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#20354e">Cible HTTP</text><text x="950" y="403" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">Port 8080 / SQLite</text><text x="950" y="429" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">UID 1000 / données fictives</text><path d="M310 365L410 365" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M745 402L930 402" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="837.5" y="392.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#466c99">TCP / HTTP</text><rect x="760" y="520" width="330" height="100" rx="10" fill="#eef3f8" stroke="#b9c9da"/><text x="780" y="555" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#20354e">Dossier de preuves</text><text x="780" y="588" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#536880">PCAP / JSONL / résultats</text><path d="M580 470L760 555" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="670.0" y="502.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#466c99">Collecte</text><path d="M1100 470L1000 520" stroke="#466c99" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1050.0" y="485.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#466c99">Événements</text><text x="45" y="515" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#ab702e">Nouvelles connexions</text><text x="45" y="542" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#ab702e">du bridge vers l’hôte :</text><text x="45" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#ab702e">refusées par le guard</text><text x="395" y="675" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#20354e">Les services partagent le noyau WSL2. Ce schéma décrit la configuration, pas une isolation de type VM.</text></svg>